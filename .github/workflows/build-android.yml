name: Build Android APK

on:
  push:
    branches:
      - prototype/first-playable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Export Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
      options: --user 0:0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          godot --version
          java -version
          mkdir -p build

      - name: Configure Godot Android export
        run: |
          echo "Godot export HOME: $HOME"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.stable" "$HOME/.config/godot" "$HOME/.android"
          test -d /root/.local/share/godot/export_templates/4.5.stable
          cp -a /root/.local/share/godot/export_templates/4.5.stable/. "$HOME/.local/share/godot/export_templates/4.5.stable/"
          cp /root/debug.keystore "$HOME/.android/debug.keystore"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          ls -la "$HOME/.local/share/godot/export_templates/4.5.stable"
          test -s "$HOME/.android/debug.keystore"

      - name: Install Android SDK target and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Import and validate project
        run: godot --headless --editor --path . --quit --import

      - name: Export debug APK
        run: godot --headless --path . --export-debug "Android" build/Streetline.apk

      - name: Verify APK archive
        run: |
          test -s build/Streetline.apk
          file build/Streetline.apk
          unzip -t build/Streetline.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streetline-Android-APK-${{ github.run_number }}
          path: build/Streetline.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable test build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Streetline Android test build #${{ github.run_number }}
          body: |
            Automated debug APK for the Streetline: Open Road prototype.
            
            This is an early test build, not a finished game. Install only if you are testing the prototype.
          prerelease: true
          make_latest: false
          files: build/Streetline.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
